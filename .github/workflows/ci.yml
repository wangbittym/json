name: CI

on:
  pull_request:
  push:
  pull_request:
  workflow_dispatch:
  schedule: [cron: "40 1 * * *"]

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Rust nightly ${{matrix.os == 'windows' && '(windows)' || ''}}
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu' && always()
        with:
          name: Cargo.lock
          path: Cargo.lock
        continue-on-error: true

  build:
    name: Rust ${{matrix.rust}} ${{matrix.os == 'windows' && '(windows)' || ''}}
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, 1.85.0, 1.71.0]
        os: [ubuntu]
        include:
          - rust: stable
            os: ubuntu
            target: aarch64-unknown-none
          - rust: stable
            os: windows
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          targets: ${{matrix.target}}
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
        if: matrix.rust != '1.71.0'
      - run: "echo skipped-for-baseline-isolation"
        if: matrix.rust != '1.71.0'
      - name: Build without std
        run: "echo skipped-for-baseline-isolation"
          ${{matrix.target}} --no-default-features --features alloc
        if: matrix.target

  minimal:
    name: Minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"

  miri:
    name: Miri (${{matrix.name}})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 64-bit little endian
            target: x86_64-unknown-linux-gnu
          - name: 64-bit big endian
            target: powerpc64-unknown-linux-gnu
          - name: 32-bit little endian
            target: i686-unknown-linux-gnu
          - name: 32-bit big endian
            target: mips-unknown-linux-gnu
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@miri
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@clippy
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - run: "echo skipped-for-baseline-isolation"

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-fuzz
      - run: cargo fuzz check

  outdated:
    name: Outdated
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/install@cargo-outdated
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
